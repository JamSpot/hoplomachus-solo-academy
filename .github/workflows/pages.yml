name: Deploy Hoplomachus Solo Academy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate website files and navigation targets
        run: |
          test -f index.html
          test -f assets/style.css
          test -f assets/site.js
          test -f guides/victorum-start.html
          test -f guides/remastered-start.html
          test -f research/scope.html
          test -f sources.html
          python - <<'PY'
          from pathlib import Path
          import re
          files = list(Path('.').rglob('*.html'))
          missing = []
          for file in files:
              text = file.read_text()
              for target in re.findall(r'href="([^"]+)"', text):
                  if target.startswith(('http://', 'https://', '#', 'mailto:')):
                      continue
                  path = (file.parent / target.split('#')[0]).resolve()
                  if not path.exists():
                      missing.append(f'{file}: {target}')
          if missing:
              print('\n'.join(missing))
              raise SystemExit('Broken local links found')
          print(f'Validated {len(files)} HTML pages; all local links resolve.')
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
